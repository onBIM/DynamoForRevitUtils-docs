  name: ElementWrapperParameters<T>
  nameWithType: ElementWrapperParameters<T>
  fullName: DynamoForRevitUtils.Entities.ParametersHandlers.ElementWrapperParameters<T>
  type: Class
  assemblies:
  - DynamoForRevitUtils
  namespace: DynamoForRevitUtils.Entities.ParametersHandlers
  summary: Represents the parameters that will be associated with an <xref href="DynamoForRevitUtils.Entities.Wrappers.ElementWrapper%601" data-throw-if-not-resolved="false"></xref> object.
  remarks: >-
    This class implements the Curiously Recurring Template Pattern (CRTP) by using a generic type parameter <code class="typeparamref">T</code>

    that represents the derived class itself. This pattern enables static polymorphism, allowing the base class

    to use functionality from the derived class at compile time. In the GetBindings method, this pattern allows

    the base class to access properties of the derived class through reflection while maintaining type safety.
  example:
  - >-
    <pre><code class="lang-csharp">public class CableTrayFittingParameters : ElementWrapperParameters&lt;CableTrayFittingParameters&gt;

    {
        // It is recommended that properties in this class 
        // have the same name to corresponding 
        // properties of ElementWrapper, but is not required.

        // Notice the Type of properties here must be of Type ElementParameter

        public ElementParameter DiffPropName { get; set; }

        public ElementParameter IDR { get; set; }

        public ElementParameter Elevation { get; set; }

        public ElementParameter EleIdParam { get; set; }

        // The constructor can't appear in the Dynamo library.
        // - If there is no need to access it by other classes, then make it 'private'.
        // - If you need to access it by other classes on the same project, make it 'internal'.
        // - If you need to access it by other projects, make it 'public' and assing it with
        //   [IsVisibleInDynamoLibrary(false)] attribute.
        internal CableTrayFittingParameters() { }

        // Static constructor shown as Dynamo Node in Library.
        // Used to allow users customize parameters used.
        public static CableTrayFittingParameters Create(
            ElementParameter comments,
            ElementParameter idr,
            ElementParameter elevation,
            ElementParameter eleId,
        ) =&gt; new()
        {
            Comments = comments,
            IDR = idr,
            Elevation = elevation,
            EleIdParam = eleId,
        };
    }</code></pre>
  syntax:
    content: >-
      [IsVisibleInDynamoLibrary(false)]

      public abstract class ElementWrapperParameters<T> : IElementWrapperParameters where T : ElementWrapperParameters<T>
    typeParameters:
    - id: T
      description: Defines the type of the derived class, which is used to access properties of the derived class at compile time.
    content.vb: >-
      <IsVisibleInDynamoLibrary(False)>

      Public MustInherit Class ElementWrapperParameters(Of T As ElementWrapperParameters(Of T)) Implements IElementWrapperParameters
